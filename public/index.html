<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #1f2328;
    }
    main {
      max-width: 560px;
      padding: 48px 32px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.02em; }
    p { margin: 0; color: #5b6470; }
    code {
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(120, 130, 145, 0.14);
      font-size: 14px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1216; color: #e6e9ee; }
      p { color: #9aa4b2; }
      code { background: rgba(160, 175, 195, 0.16); }
    }
  </style>
</head>
<body>
  <main>
    <h1>Service is running</h1>
    <p>This host serves a subscription endpoint at <code>/sub</code>.</p>
  </main>
</body>
</html>
